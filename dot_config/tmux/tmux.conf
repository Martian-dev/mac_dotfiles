# Default Ctrl+B prefix and default tmux keybindings.
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'
set -g history-limit 50000

# Keep the default split keys, opening each new pane in the current pane's cwd.
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

# Everforest dark medium.
set -g status-style 'bg=#232a2e,fg=#d3c6aa'
set -g pane-border-style 'fg=#475258'
set -g pane-active-border-style 'fg=#a7c080'
set -g message-style 'bg=#343f44,fg=#d3c6aa'
setw -g mode-style 'bg=#a7c080,fg=#2d353b'
setw -g window-status-style 'bg=#232a2e,fg=#859289'
setw -g window-status-current-style 'bg=#a7c080,fg=#2d353b,bold'
set -g status-left '#[fg=#a7c080,bold] #S #[default]'
set -g status-right '#[fg=#a7c080]%H:%M #[fg=#859289]%d %b '

# Additional Option+number bindings; all default prefix bindings stay intact.
bind-key -n M-0 select-window -t :0
bind-key -n M-1 select-window -t :1
bind-key -n M-2 select-window -t :2
bind-key -n M-3 select-window -t :3
bind-key -n M-4 select-window -t :4
bind-key -n M-5 select-window -t :5
bind-key -n M-6 select-window -t :6
bind-key -n M-7 select-window -t :7
bind-key -n M-8 select-window -t :8
bind-key -n M-9 select-window -t :9

# Save manually: Ctrl+B Ctrl+S. Restore: Ctrl+B Ctrl+R.
# Continuum saves every 15 minutes and restores on tmux server startup.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
run-shell '~/.config/tmux/plugins/tpm/tpm'
